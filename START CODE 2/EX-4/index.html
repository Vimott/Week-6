<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media and Clamp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <h1>Media Query</h1>
            <div class="media-box">
                <span class="small">I'm SMALL 🥲 </span>
                <span class="big">I'm BIG 😱 </span>
            </div>
        </section>

        <section>
            <h2>Clamp Width</h2>
            <div class="clamp-area">
                <div class="clamp-box"></div>
            </div>
        </section>
    </main>
</body>
</html>
